# Netlify deploy config for the SPICA "The 34% Question" fire lab.
# Publish the Vite build output; the app has no client-side routes, but
# the SPA fallback keeps deep links / refreshes serving index.html.
# Static assets are content-hashed by Vite (or never change in place),
# so they get immutable long caching. index.html itself is never cached,
# so a new deploy is picked up immediately. No quality-affecting
# settings here — CDN gzip/brotli is lossless transport compression.
[build]
  publish = "dist"
  command = "npm run build"

# Verdict-engine API (Flask logic ported to a pure-stdlib Python
# function — no install step, no card, no separate host). The function
# lives in netlify/functions/api/ and is served at /api/*; the GitHub
# Pages deploy calls https://spica-firelab.netlify.app cross-origin
# instead (the function sends Access-Control-Allow-Origin: *).
[functions]
  directory = "netlify/functions"

# The /api/* rewrite MUST come before the SPA fallback below — Netlify
# takes the first matching redirect.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/draco/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hdr/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
